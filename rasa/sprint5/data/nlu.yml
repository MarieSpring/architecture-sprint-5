version: "3.1"
nlu:
- intent: greet
  examples: |
    - Привет
    - Здравствуйте
    - Добрый день
    - привет
- intent: goodbye
  examples: |
    - До свидания
    - Пока
    - Увидимся
    - пока
- intent: ask_architecture
  examples: |
    - Расскажите об архитектуре ПО
    - Какие подходы существуют в архитектуре?
    - Что такое микросервисная архитектура?
    - Как выбрать архитектуру ПО?
    - расскажи о микросервисах
- intent: affirm
  examples: |
    - Да
    - Верно
    - Именно
    - Конечно
    - да
- intent: deny
  examples: |
    - Нет
    - Не нужно
    - Неверно
    - нет
- intent: request_info
  examples: |
    - Расскажите больше об этом
    - Можете уточнить?
    - Какие есть детали?
    - расскажи еще
